- name: create ec2 and route53
  hosts: local
  connection: local
  vars:
    ami_id: "ami-0220d79f3f480ecf5"
    sg_id: "sg-056f6ae1ff0429ac9"
    zone_id: "Z09150472BEG29NERJFM7"
    domain_name: "dso86s.xyz"
    # we can pass instances through command line using -e
    # instances:
    # - mongodb 
    # - redis
    # - mysql
    # - rabbitmq
    # - catalogue
    # - user
    # - cart
    # - shipping
    # - payment
    # - frontend
  tasks:
  - name: create ec2 instance 
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      vpc_subnet_id: subnet-02a9e2ee3cabd4c49
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

  # - name: print the ec2_output
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output }}"

  # - name: print public IP
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output.results[0].instances[0].public_ip_address }}"
  #   # loop: "{{ ec2_output.results }}"

  # - name: print private IP
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output.results[0].instances[0].private_ip_address }}"
    
  - name: create route53 record 
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" # mongodb.dso86s.xyz
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}" # private ip adding 
      overwrite: true
    loop: "{{ ec2_output.results }}"

    # we are creating one record with public ip only for frontend
  - name: create route53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" # dso86s.xyz
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}" # public ip adding 
      overwrite: true
    when: item.item == "frontend"
    loop: "{{ ec2_output.results }}"